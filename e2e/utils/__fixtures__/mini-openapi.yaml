# Small, CLEAN bundled-style spec (internal refs only) for the permission-matrix generator tests.
# Not the real RMS contract. 18 operations, zero contract problems.
openapi: 3.1.0
info:
  title: RMS mini fixture
  version: 0.0.0-test
security:
  - bearerAuth: []
paths:
  /terminals/setup-options:
    post:
      tags: [terminals]
      operationId: getTerminalSetupOptions
      security: []
      x-permission: TERMINAL_MANAGE
      x-auth: INLINE_CREDENTIALS
      x-requirements: [P1-AUTH-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerCredentials' }
      responses:
        '200': { description: ok }
  /terminals:
    post:
      tags: [terminals]
      operationId: registerTerminal
      security: []
      x-permission: TERMINAL_MANAGE
      x-auth: INLINE_CREDENTIALS
      x-requirements: [P1-AUTH-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTerminalRequest' }
      responses:
        '201': { description: registered }
  /auth/me/pin:
    post:
      tags: [auth]
      operationId: setOwnPin
      x-permission: AUTHENTICATED
      x-requirements: [P1-AUTH-05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOwnPinRequest' }
      responses:
        '204': { description: set }
  /settings/service-charges:
    put:
      tags: [settings]
      operationId: updateServiceChargeSettings
      x-permission: SETTINGS_MANAGE
      x-requirements: [P1-SET-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServiceChargeSettingsRequest' }
      responses:
        '200': { description: ok }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      x-permission: PUBLIC
      x-requirements: [P1-AUTH-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: ok }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security: []
      x-permission: NONE
      x-requirements: [P1-AUTH-02]
      responses:
        '200': { description: ok }
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      x-permission: AUTHENTICATED
      x-requirements: [P1-AUTH-01]
      responses:
        '200': { description: ok }
  /users:
    summary: not an operation
    x-something: ignored
    get:
      tags: [users]
      operationId: listUsers
      x-permission: USER_MANAGE
      x-requirements: [P1-RBAC-02]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: ok }
    post:
      tags: [users]
      operationId: createUser
      x-permission: USER_MANAGE
      x-requirements: [P1-RBAC-02, P1-AUTH-05]
      requestBody:
        $ref: '#/components/requestBodies/CreateUser'
      responses:
        '201': { description: created }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      x-permission: USER_MANAGE
      x-requirements: [P1-RBAC-02]
      responses:
        '200': { description: ok }
    put:
      tags: [users]
      operationId: updateUser
      x-permission: USER_MANAGE
      x-requirements: [P1-RBAC-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { description: ok }
  /users/{userId}/unlock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: unlockUser
      x-permission: USER_MANAGE
      x-requirements: [P1-AUTH-01]
      responses:
        '204': { description: unlocked }
  /audit-logs:
    get:
      tags: [audit]
      operationId: searchAuditLogs
      x-permission: AUDIT_VIEW
      x-requirements: [P1-AUD-03]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: ok }
  /kitchen-stations/{stationId}/kots:
    get:
      tags: [kitchen]
      operationId: listStationKots
      x-permission: [KDS_OPERATE, KDS_VIEW_ALL]
      x-requirements: [P1-KDS-01, P1-RBAC-04]
      parameters:
        - name: stationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: ok }
  /kots/{kotId}/status:
    post:
      tags: [kitchen]
      operationId: updateKotStatus
      x-permission: KDS_OPERATE
      x-requirements: [P1-KDS-02]
      parameters:
        - name: kotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKotStatusRequest'
      responses:
        '200': { description: ok }
  /bills/{billId}/void:
    post:
      tags: [billing]
      operationId: voidBill
      x-permission: BILL_VOID
      x-approval: MANAGER
      x-idempotent: true
      x-requirements: [P1-CAN-05]
      parameters:
        - name: billId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidBillRequest' }
      responses:
        '200': { description: ok }
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      x-permission: ORDER_CREATE
      x-idempotent: true
      x-requirements: [P1-ORD-01]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.rms.order+json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201': { description: created }
  /reports/pos/export:
    get:
      tags: [reports]
      operationId: exportPosReports
      x-permission:
        allOf: [REPORT_POS_ALL, REPORT_EXPORT]
      x-requirements: [P1-RPT-01]
      parameters:
        - name: format
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ExportFormat' }
        - name: X-Report-Locale
          in: header
          required: true
          schema: { type: string, example: en-LK }
      responses:
        '200': { description: ok }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    CreateUser:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateUserRequest' }
  schemas:
    OwnerCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, examples: [owner] }
        password: { type: string, format: password }
    Money:
      type: string
      pattern: '^-?\d{1,10}\.\d{2}$'
      example: '1100.00'
    Pin:
      type: string
      pattern: '^\d{4,6}$'
      example: '1234'
    OrderType:
      type: string
      enum: [DINE_IN, TAKEAWAY, DELIVERY, CREDIT]
    KotStatus:
      type: string
      enum: [NEW, PREPARING, READY, HANDED_OVER]
    ExportFormat:
      type: string
      enum: [pdf, xlsx]
    Approval:
      type: object
      required: [approverUsername, pin]
      properties:
        approverUsername: { type: string, example: manager1 }
        pin: { $ref: '#/components/schemas/Pin' }
    ServiceChargeOrderType:
      type: string
      enum: [DINE_IN, TAKEAWAY, DELIVERY]
    RegisterTerminalRequest:
      type: object
      required: [credentials, name, type]
      properties:
        credentials:
          type: object
          required: [username, password]
          properties:
            username: { type: string, examples: [owner] }
            password: { type: string, format: password }
        name: { type: string, examples: [Cashier POS 1] }
        type: { type: string, enum: [CASHIER_POS, RECEPTION_POS, KITCHEN, ADMIN, DISPLAY] }
    SetOwnPinRequest:
      type: object
      required: [currentPassword, newPin]
      properties:
        currentPassword: { type: string, format: password }
        newPin: { $ref: '#/components/schemas/Pin' }
    UpdateServiceChargeSettingsRequest:
      type: object
      required: [rules, version]
      properties:
        rules:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [orderType, rate]
            properties:
              orderType: { $ref: '#/components/schemas/ServiceChargeOrderType' }
              rate: { type: string, examples: ['10.00'] }
        version: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3 }
        password: { type: string, format: password }
    CreateUserRequest:
      type: object
      required: [username, fullName, password, pin, roleIds]
      properties:
        username: { type: string, example: newuser }
        fullName: { type: string }
        password: { type: string, format: password }
        pin: { $ref: '#/components/schemas/Pin' }
        roleIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
    UpdateUserRequest:
      allOf:
        - type: object
          required: [fullName]
          properties:
            fullName: { type: string, example: Updated Name }
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    UpdateKotStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/KotStatus' }
    VoidBillRequest:
      type: object
      required: [reason, comment, approval]
      properties:
        reason: { type: string, example: Customer left }
        comment: { type: string }
        approval: { $ref: '#/components/schemas/Approval' }
    CreateOrderRequest:
      type: object
      required: [orderType, priceList]
      properties:
        orderType: { $ref: '#/components/schemas/OrderType' }
        priceList:
          oneOf:
            - { type: string, enum: [LOCAL, FOREIGN] }
            - { type: 'null' }
        guests: { type: integer, minimum: 1 }
