# Local development database. The backend runs from the IDE / ./mvnw on port 8080.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Postgres is published on host port 15432 so it does not clash with a local install on 5432.
# Roles: rms_owner (superuser, owns the schema, runs Flyway) and rms_app (the app's login,
# created by postgres-init/01-app-role.sql; no UPDATE/DELETE on audit_log).
name: rms-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rms
      POSTGRES_USER: rms_owner
      POSTGRES_PASSWORD: rms_owner_dev
      TZ: UTC
    ports:
      - "15432:5432"
    volumes:
      - rms-dev-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms_owner -d rms"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rms-dev-pgdata:
