openapi: 3.1.0
info:
  title: RMS API
  version: 0.3.0
  summary: Restaurant Management System for Santhula Hotel.
  description: >-
    Contract for the RMS backend (contract-first, ADR-005). Rules every endpoint follows are in
    `docs/api/conventions.md`.


    **Auth.** Every call sends `Authorization: Bearer <accessToken>` (except login, refresh and
    terminal registration). There are two kinds of session (ADR-008). A **terminal session** is
    started from a registered device and sends `X-Terminal-Id: <uuid>` on every call; it must match
    the terminal in the access token. A **personal session** is started without a terminal (users
    holding LOGIN_ANY_DEVICE only) and must not send the header. A header on the wrong kind of
    session gets 403 TERMINAL_MISMATCH.


    **Extensions.** `x-permission` (permission code checked server-side; `AUTHENTICATED` = any
    logged-in user, `PUBLIC` = no token), `x-requirements` (requirement IDs), `x-approval`
    (MANAGER / OWNER PIN approval inline), `x-idempotent` (requires `Idempotency-Key`),
    `x-auth: INLINE_CREDENTIALS` (credentials in the body instead of a token; the user must hold
    `x-permission`), `x-terminal: REQUIRED` (needs a terminal session; a personal session gets 403
    TERMINAL_REQUIRED. No M1.0 / M1.1 operation is marked; orders, payments, shifts and kitchen
    screens are, from M1.2).


    M1.0 Foundation: auth, users, roles, terminals, audit, settings.


    M1.1 Catalog & floor: kitchen stations, categories, menu items and modifiers, tables and floor plan,
    delivery areas, reasons, spreadsheet import.


    0.3.0 (client decision #9, ADR-008): personal login without a terminal, `sessionType` on the
    session, `x-terminal`, personal idle timeout, `clientInfo` on audit entries.
servers:
  - url: /api/v1
    description: Same origin as the web app (nginx proxies /api to the backend).
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Login, tokens and the logged-in user's own account (P1-AUTH-*).
  - name: users
    description: User accounts, locks, password / PIN resets, role assignment (owner).
  - name: roles
    description: Roles and the permission list (P1-RBAC-*).
  - name: terminals
    description: Registered devices - POS, kitchen screens, admin, displays (P1-AUTH-04).
  - name: audit
    description: Append-only audit log search and export (P1-AUD-*).
  - name: settings
    description: Restaurant details, service charge, tax, business day, idle timeouts, delivery areas, reasons, menu setting (P1-SET-*).
  - name: menu
    description: Kitchen stations, categories, menu items with LOCAL / FOREIGN prices, availability, modifier groups, POS menu view (P1-MENU-*).
  - name: floor
    description: Ordering points, tables and the floor plan (P1-FLOOR-*).
  - name: import
    description: Spreadsheet import of categories, menu items, modifier groups and tables (P1-IMP-01).

