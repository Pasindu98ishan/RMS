components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login or /auth/refresh (lifetime at most 15 min).
  schemas:
    # STOMP payloads are not referenced by any REST operation; they are listed here so the bundle
    # (and both code generators) include them.
    NotificationEvent:
      $ref: components/events.yaml#/components/schemas/NotificationEvent
    # Inline PIN approval body (conventions.md, Approvals). First used by an operation in M1.2;
    # listed here so both generators already emit the type.
    Approval:
      $ref: components/common.yaml#/components/schemas/Approval

x-websocket-events:
  endpoint: /ws
  description: >-
    STOMP over WebSocket. CONNECT with header `Authorization: Bearer <accessToken>`. Subscriptions
    are authorised on the server. Every message is the envelope {event, id, at, data}; messages are
    hints and clients reload over REST after any reconnect.
  destinations:
    - destination: /user/queue/notifications
      subscribers: The logged-in user (their own queue only).
      x-permission: AUTHENTICATED
      events:
        - event: NOTIFICATION_CREATED
          description: A new in-app notification for this user.
          payload:
            $ref: '#/components/schemas/NotificationEvent'
