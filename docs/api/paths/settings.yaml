/settings/idle-timeouts:
  get:
    tags: [settings]
    operationId: getIdleTimeoutSettings
    summary: Get idle logout time per terminal type
    x-permission: SETTINGS_MANAGE
    x-requirements: [P1-AUTH-03]
    responses:
      '200':
        description: Idle timeout rules for all terminal types.
        content:
          application/json:
            schema:
              $ref: '../components/settings.yaml#/components/schemas/IdleTimeoutSettings'
      '401':
        $ref: '../components/common.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/components/responses/Forbidden'
  put:
    tags: [settings]
    operationId: updateIdleTimeoutSettings
    summary: Update idle logout time per terminal type
    description: >-
      Send CASHIER_POS, RECEPTION_POS and ADMIN, each once (1 to 240 minutes). KITCHEN and DISPLAY are
      exempt and rejected with 422. Terminals pick up the new value at their next login or token refresh.
      409 VERSION_CONFLICT.
    x-permission: SETTINGS_MANAGE
    x-requirements: [P1-AUTH-03, P1-AUD-01]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/settings.yaml#/components/schemas/UpdateIdleTimeoutSettingsRequest'
    responses:
      '200':
        description: Updated.
        content:
          application/json:
            schema:
              $ref: '../components/settings.yaml#/components/schemas/IdleTimeoutSettings'
      '400':
        $ref: '../components/common.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/components/responses/Forbidden'
      '409':
        $ref: '../components/common.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/common.yaml#/components/responses/ValidationFailed'

