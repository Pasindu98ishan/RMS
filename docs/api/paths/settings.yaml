    operationId: listReasonOptions
    summary: 'List active reasons of one list to pick from'
    description: >-
      Narrow lookup for the reason dialogs (cancel, void, refund, petty cash, other discount):
      active reasons of one category, by text. Needs ORDER_VIEW, which every role that opens
      these dialogs holds.
    x-permission: ORDER_VIEW
    x-requirements: [P1-SET-08]
    parameters:
