# Paths: settings (P1-SET-01..04, idle timeouts for P1-AUTH-03).
# Every update writes SETTINGS_CHANGED to the audit log with before/after values.
# Kitchen target times (P1-SET-05) live on the kitchen stations (paths/menu.yaml).
# Change log (breaking changes are listed here with the date):
# - 2026-11-21 v0.1.0 initial M1.0 contract.
# - 2026-11-22 v0.2.0 added for M1.1: delivery areas, reasons, menu setting. Not breaking.
/settings/restaurant:
  get:
    tags: [settings]
    operationId: getRestaurantDetails
    summary: Get restaurant details printed on receipts
    x-permission: SETTINGS_MANAGE
    x-requirements: [P1-SET-03]
    responses:
      '200':
        description: Restaurant details.
        content:
          application/json:
            schema:
              $ref: '../components/settings.yaml#/components/schemas/RestaurantDetails'
      '401':
        $ref: '../components/common.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/components/responses/Forbidden'
  put:
    tags: [settings]
    operationId: updateRestaurantDetails
    summary: Update restaurant details printed on receipts
    description: Applies to receipts printed from now on (including reprints). 409 VERSION_CONFLICT on a stale version.
    x-permission: SETTINGS_MANAGE
    x-requirements: [P1-SET-03, P1-AUD-01]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/settings.yaml#/components/schemas/UpdateRestaurantDetailsRequest'
    responses:
      '200':
        description: Updated.
        content:
          application/json:
            schema:
              $ref: '../components/settings.yaml#/components/schemas/RestaurantDetails'
      '400':
        $ref: '../components/common.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/components/responses/Forbidden'
      '409':
        $ref: '../components/common.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/common.yaml#/components/responses/ValidationFailed'

